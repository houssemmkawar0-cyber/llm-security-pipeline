name: 🤖 LLM Security Evaluation via Kaggle GPU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/kaggle-eval.yml'
      - 'kernel-metadata.json'

env:
  PYTHON_VERSION: '3.10'
  KAGGLE_KERNEL_DIR: './kaggle_kernel'
  RESULTS_DIR: './results'

jobs:
  submit-to-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r config/requirements.txt
          # Installation d'une version spécifique de la CLI pour la stabilité
          pip install kaggle==1.5.16

      - name: 🔐 Setup Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          # Création robuste du fichier de credentials avec un saut de ligne final
          printf '{"username":"%s","key":"%s"}\n' "${{ secrets.KAGGLE_USERNAME }}" "${{ secrets.KAGGLE_KEY }}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "✅ Credentials Kaggle créés"

      - name: 📦 Prepare kernel directory
        run: |
          mkdir -p ${{ env.KAGGLE_KERNEL_DIR }}
          cp -r src config ${{ env.KAGGLE_KERNEL_DIR }}/
          cp kernel-metadata.json ${{ env.KAGGLE_KERNEL_DIR }}/
          echo "✅ Kernel préparé"

      - name: 🚀 Submit to Kaggle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
        run: |
          cd ${{ env.KAGGLE_KERNEL_DIR }}
          
          echo "🔍 DEBUG : Liste des fichiers :"
          ls -la
          
          echo "🔍 DEBUG : Contenu de kernel-metadata.json :"
          cat kernel-metadata.json
          
          echo "📤 Push vers Kaggle..."
          # Utilisation de --new pour forcer la création si l'update échoue, 
          # ou simplement push si vous voulez updater. 
          # Ici on essaie le push standard, mais avec plus de logs d'erreur bruts.
          kaggle kernels push -p . 2>&1
          
          # Vérification explicite du code de retour
          if [ $? -ne 0 ]; then
            echo "❌ ÉCHEC DU PUSH KAGGLE. Voir les erreurs ci-dessus."
            exit 1
          fi
          echo "✅ Push réussi"
          
          echo "⏳ Attente complétion..."
          timeout 7200 bash -c '
            while true; do
              status=$(kaggle kernels status -p . 2>&1 | grep -i "status" | cut -d: -f2 | tr -d " ")
              echo "   Status: $status"
              if [[ "$status" == "complete" ]]; then
                echo "✅ Exécution terminée"
                exit 0
              elif [[ "$status" == "error" ]] || [[ "$status" == "failed" ]]; then
                echo "❌ Échec sur Kaggle"
                exit 1
              fi
              sleep 30
            done
          '
          
          echo "📥 Téléchargement résultats..."
          mkdir -p ../${{ env.RESULTS_DIR }}
          kaggle kernels output -p ../${{ env.RESULTS_DIR }}
          echo "✅ Pipeline terminé"

      - name: 📤 Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/
          retention-days: 14

      - name: 📊 Post summary
        if: always()
        run: |
          echo "## 📈 Résumé Évaluation" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.RESULTS_DIR }}/results.json" ]; then
            echo "✅ Résultats disponibles" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Aucun résultat trouvé" >> $GITHUB_STEP_SUMMARY
          fi
